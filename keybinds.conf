# this is an example config for keybinds.
# Comments starts with #, empty lines are ignored (trailing spaces too),
# and keybind syntax is `[[comdo-]<key> ] command`.

[-] # optional
# moving
A-b     go_left_word
C-left  go_left_word
A-f     go_right_word
C-right go_right_word
A-S-b   go_left_to_word
A-S-f   go_right_to_word
A-C-b   go_back_expr
A-C-f   go_forward_expr
C-up    go_previous_paragraph
C-down  go_next_paragraph
A-{     go_previous_paragraph
A-}     go_next_paragraph
C-b     go_left
C-f     go_right
C-p     go_up_line
C-n     go_down_line
up      go_up_line
down    go_down_line
left    go_left
right   go_right
home    go_line_beginning
C-a     go_line_beginning
end     go_line_end
C-e     go_line_end
C-z     undo
C-S-z   redo

# editor work
C-x C-f open_file_dialog
C-x C-s save_path_or_prompt
C-x C-w prompt_and_save
C-space set_mark
C-m swap_mark_with_cursor
A-w copy_selection
C-w cut_selection
C-y paste_text

# text processing
return insert_newline
tab insert_tab
backspace   remove_previous_char
C-backspace remove_previous_word
A-backspace remove_previous_word # probably should differ like in 4coder

[file_dialog]
return enter_path
C-g abort_file_dialog